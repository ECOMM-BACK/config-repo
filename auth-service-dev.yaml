server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:ECOMMAPP}
    password: ${DB_PASSWORD:Pass#1Dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

security:
  jwt:
    secret: ${JWT_SECRET:nlTcDfAWypqnIp18I1N5Kl0w7xdLMlm6R8goLAn9Mp4=}
    issuer: ecommerce-auth-service
    audience: ecommerce-clients
    ttl-seconds: 3600
  policy:
    password-min-length: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

ecommerce:
  observability:
    trace-header: traceparent